# Generated by benchmark/make_configs.py - do not edit by hand.
# ${...} placeholders are expanded from the environment by third_party/rPPG-Toolbox/config.py.
BASE:
- ''
TOOLBOX_MODE: only_test
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: ${KR_RPPG_WORK}/runs/preprocess/pure_physformer
MODEL:
  NAME: PhysFormer
  DROP_RATE: 0.1
  PHYSFORMER:
    PATCH_SIZE: 4
    DIM: 96
    FF_DIM: 144
    NUM_HEADS: 4
    NUM_LAYERS: 12
    THETA: 0.7
TEST:
  METRICS:
  - MAE
  - RMSE
  - MAPE
  - Pearson
  - SNR
  USE_LAST_EPOCH: true
  DATA:
    FS: 30
    DATASET: PURE
    DO_PREPROCESS: true
    DATA_FORMAT: NCDHW
    DATA_PATH: ${PURE_ROOT}
    CACHED_PATH: ${KR_RPPG_WORK}/cache/pure/physformer
    EXP_DATA_NAME: ''
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - DiffNormalized
      DATA_AUG:
      - None
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 128
        W: 128
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: false
    WINDOW_SIZE: 10
  MODEL_PATH: ''
